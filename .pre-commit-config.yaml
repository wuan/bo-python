repos:
- repo: https://github.com/gitleaks/gitleaks
  rev: v8.30.0
  hooks:
  - id: gitleaks
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: end-of-file-fixer
  - id: trailing-whitespace
- repo: local
  hooks:
  - id: pylint
    name: pylint
    description: Run pylint in the project Poetry environment.
    # Use the project's own pylint/dependencies (via Poetry) so imports
    # resolve, apply the project rcfile, and gate on the same score as CI.
    # ``pass_filenames: false`` lints the whole package instead of only the
    # changed files, whose per-file scores are not meaningful.
    entry: poetry run pylint --rcfile=pylint.rc --fail-under=7.5 blitzortung
    language: system
    pass_filenames: false
    files: ^blitzortung/
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v1.20.1
  hooks:
  - id: mypy
    files: ^blitzortung/
    additional_dependencies: [pyproj, shapely, psycopg2-binary, fasteners, txpostgres]
